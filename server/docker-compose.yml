# QuartzLED home server (ProBook): MQTT broker + Home Assistant.
# Lives in ~/quartzled-server on the ProBook; started by setup.sh.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host   # mDNS/HomeKit/Matter discovery need the LAN directly; UI on :8123
    environment:
      - TZ=Europe/Istanbul
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    depends_on:
      - mosquitto

  minibeyaz:
    build: ./minibeyaz
    container_name: minibeyaz
    restart: unless-stopped
    network_mode: host        # MQTT on 127.0.0.1:1883, survey on 127.0.0.1:8790
    user: "1000:1000"         # same uid as the desktop session that owns the audio socket
    env_file: ./minibeyaz/minibeyaz.env
    volumes:
      - ./minibeyaz/models:/models:ro
      - ./minibeyaz/data:/data
      - /etc/localtime:/etc/localtime:ro
      - type: bind            # desktop session's PipeWire (PulseAudio protocol); never auto-created
        source: /run/user/1000/pulse
        target: /run/pulse
        bind:
          create_host_path: false
    depends_on:
      - mosquitto
