; QuartzLED firmware — Deneyap Kart (ESP32-D0WD-V3, 4MB, no PSRAM)
;   USB:  pio run -e deneyap -t upload
;   OTA:  pio run -e ota -t upload        (board must be on Wi-Fi as quartzled.local)
;   Distribution: pio run -e genel        (no secrets baked in; the Quartz app pairs it over USB
;                                          with {"cmd":"esle"}, see README)
; Edit lib_deps by hand: `pio pkg install` rewrites this file and inlines secrets.ini.

[platformio]
extra_configs = secrets.ini   ; ota_password, gitignored
default_envs = deneyap

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    fastled/FastLED@~3.9.16
    bblanchon/ArduinoJson@^7.2.0
    homespan/HomeSpan@~1.9.1   ; 2.x needs Arduino core 3.x
    knolleary/PubSubClient@^2.8
build_flags =
    -DLED_PIN=23
    -DLED_MAX=300
    -DFW_VERSION=\"0.13.0\"
    -DCORE_DEBUG_LEVEL=1

; Owner builds: compile-time fallbacks from secrets.ini (runtime "esle" values override them).
[env:deneyap]
; Hub/cable corrupts serial at >=460800
upload_speed = 115200
build_flags =
    ${env.build_flags}
    -DOTA_PASSWORD=\"${secrets.ota_password}\"
    -DHOMEKIT_CODE=\"${secrets.homekit_code}\"

; Distribution build shipped inside the Quartz app: no secrets.ini references, no baked-in
; secrets. OTA stays off and HomeSpan keeps its default setup code until the board is paired.
[env:genel]
upload_speed = 115200
build_flags =
    ${env.build_flags}
    -DOTA_PASSWORD=\"\"
    -DHOMEKIT_CODE=\"\"
    -DQUARTZ_GENEL=1

[env:ota]
build_flags =
    ${env.build_flags}
    -DOTA_PASSWORD=\"${secrets.ota_password}\"
    -DHOMEKIT_CODE=\"${secrets.homekit_code}\"
upload_protocol = espota
upload_port = quartzled.local
upload_flags =
    --auth=${secrets.ota_password}
    --port=3232
