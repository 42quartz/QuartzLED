; MiniBeyaz LED firmware — Deneyap Kart (ESP32-D0WD-V3, 4MB, no PSRAM)

[env:deneyap]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
; Hub/cable corrupts serial at >=460800
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    fastled/FastLED@~3.9.16
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DLED_PIN=23
    -DLED_MAX=300
    -DFW_VERSION=\"0.1.0\"
    -DCORE_DEBUG_LEVEL=1
